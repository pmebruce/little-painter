<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#F7F3E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>小小畫畫教室 — 兒童繪畫技巧學習 PWA</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<style>
:root {
  --bg: #FFFDF7;
  --primary: #FF7A59;
  --primary-dk: #E05A3A;
  --sec: #3EC1D3;
  --yellow: #FFD166;
  --text: #2B2D42;
  --muted: #5C6378;
  --border: #E2E8F0;
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}
header {
  background: linear-gradient(135deg, #FF7A59 0%, #FF9F1C 100%);
  color: #fff;
  padding: 10px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-shadow: 0 3px 10px rgba(255, 122, 89, 0.25);
  z-index: 10;
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand-icon {
  width: 34px;
  height: 34px;
  background: #fff;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 19px;
  flex-shrink: 0;
}
.brand-title {
  font-weight: 800;
  font-size: 1.05rem;
  line-height: 1.2;
}
.brand-sub {
  font-size: 0.7rem;
  opacity: 0.92;
}
.header-btns {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}
.pill-btn {
  border: none;
  background: rgba(255, 255, 255, 0.24);
  color: #fff;
  padding: 6px 10px;
  border-radius: 9px;
  font-size: 0.875rem;
  font-weight: 700;
  cursor: pointer;
}
.mode-tabs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 5px;
  background: rgba(255, 255, 255, 0.2);
  padding: 4px;
  border-radius: 11px;
}
.mode-tab {
  border: none;
  background: transparent;
  color: #fff;
  font-weight: 700;
  font-size: 0.875rem;
  padding: 8px 4px;
  border-radius: 8px;
  cursor: pointer;
  text-align: center;
  white-space: nowrap;
}
.mode-tab.active {
  background: #fff;
  color: var(--primary-dk);
  box-shadow: 0 2px 6px rgba(0,0,0,0.12);
}

/* Main Content Grid */
.workspace {
  flex: 1;
  display: grid;
  grid-template-columns: 280px 1fr 240px;
  gap: 10px;
  padding: 10px;
  max-width: 1400px;
  width: 100%;
  margin: 0 auto;
}
@media (max-width: 900px) {
  .workspace {
    grid-template-columns: 1fr;
    gap: 8px;
    padding: 8px;
  }
}
.panel {
  background: #fff;
  border-radius: 16px;
  border: 2px solid var(--border);
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-shadow: 0 4px 12px rgba(43, 45, 66, 0.05);
}
.section-title {
  font-size: 0.84rem;
  font-weight: 800;
  color: var(--text);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.lesson-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}
@media (min-width: 901px) {
  .lesson-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}
.lesson-btn {
  border: 2px solid var(--border);
  background: #FFFDF9;
  border-radius: 9px;
  padding: 8px 4px;
  cursor: pointer;
  font-weight: 700;
  font-size: 0.875rem;
  text-align: center;
}
.lesson-btn.active {
  border-color: var(--primary);
  background: #FFF3EF;
  color: var(--primary-dk);
}
.coach-row {
  display: flex;
  gap: 10px;
  align-items: center;
}
.preview-box {
  background: #F8FAFF;
  border: 2px dashed #CBD5E1;
  border-radius: 10px;
  padding: 4px;
  width: 110px;
  flex-shrink: 0;
  text-align: center;
}
@media (min-width: 901px) {
  .coach-row {
    flex-direction: column;
  }
  .preview-box {
    width: 100%;
  }
}
.step-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.step-tip {
  background: #FFF9DB;
  border-left: 4px solid var(--yellow);
  padding: 7px 9px;
  border-radius: 7px;
  font-size: 0.8rem;
  line-height: 1.38;
}
.btn-row {
  display: flex;
  gap: 6px;
  justify-content: space-between;
}
.btn {
  border: none;
  border-radius: 8px;
  padding: 7px 10px;
  font-weight: 700;
  font-size: 0.875rem;
  cursor: pointer;
  flex: 1;
  text-align: center;
}
.btn-pri { background: var(--primary); color: #fff; }
.btn-sec { background: #EDF2F7; color: var(--text); }
.btn-acc { background: var(--sec); color: #fff; }

.toggles-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 12px;
  align-items: center;
  justify-content: space-between;
  font-size: 0.76rem;
  font-weight: 700;
  color: var(--muted);
  border-top: 1px solid var(--border);
  padding-top: 6px;
}
.toggles-bar label {
  display: flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
}

/* Canvas Area */
.stage {
  background: #EEF2F6;
  border-radius: 16px;
  border: 2px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.toolbar {
  background: #fff;
  padding: 7px 10px;
  border-bottom: 2px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.canvas-wrap {
  position: relative;
  aspect-ratio: 4 / 3;
  width: min(calc(100% - 16px), calc(56dvh * 4 / 3));
  max-height: 56dvh;
  align-self: center;
  margin: 8px;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.06);
  overflow: hidden;
}
@media (min-width: 901px) {
  .canvas-wrap {
    width: calc(100% - 16px);
    height: auto;
    max-height: none;
    min-height: 0;
  }
}
canvas.layer {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  touch-action: none;
  cursor: crosshair;
}
#guideCanvas, #gridCanvas {
  pointer-events: none;
}

/* Brushes & Colors */
.tool-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 5px;
}
@media (min-width: 901px) {
  .tool-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}
.tool-btn {
  border: 2px solid var(--border);
  background: #fff;
  border-radius: 10px;
  padding: 6px 2px;
  font-size: 0.875rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.tool-btn.active {
  border-color: var(--sec);
  background: #EBFBFD;
  color: #0B7285;
}
.palette {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 7px;
  padding: 2px 0;
}
@media (min-width: 901px) {
  .palette {
    grid-template-columns: repeat(4, 1fr);
  }
}
.swatch {
  width: 100%;
  aspect-ratio: 1;
  max-width: 36px;
  margin: 0 auto;
  border-radius: 50%;
  border: 2px solid #fff;
  box-shadow: 0 2px 5px rgba(0,0,0,0.16);
  cursor: pointer;
}
.swatch.active {
  transform: scale(1.15);
  outline: 2px solid var(--text);
}
.mixer {
  background: #F8FAFC;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 7px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}
.mixer-slots {
  display: flex;
  align-items: center;
  gap: 5px;
}
.slot {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 2px solid #fff;
  box-shadow: 0 2px 5px rgba(0,0,0,0.15);
  cursor: pointer;
}
.mix-out {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  border: 2px solid #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,0.18);
  cursor: pointer;
}
.badge {
  font-size: 0.7rem;
  padding: 3px 7px;
  border-radius: 12px;
  background: #F1F5F9;
  color: #64748B;
  font-weight: 700;
  display: inline-block;
  margin: 2px;
}
.badge.on {
  background: #FEF3C7;
  color: #B45309;
  border: 1px solid #F59E0B;
}
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 99;
  padding: 16px;
}
.modal.open { display: flex; }
.modal-card {
  background: #fff;
  border-radius: 16px;
  max-width: 520px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  padding: 16px;
}
.toast {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%) translateY(70px);
  background: #2B2D42;
  color: #fff;
  padding: 8px 16px;
  border-radius: 20px;
  font-weight: 700;
  font-size: 0.82rem;
  transition: 0.25s;
  z-index: 120;
  white-space: nowrap;
}
.toast.show {
  transform: translateX(-50%) translateY(0);
}
button, select, input { min-height: 36px; }
.panel, .stage, .step-info { min-width: 0; }
.toast { white-space: normal; text-align: center; width: max-content; max-width: 92vw; }
@media (max-width: 420px) { .mode-tabs { grid-template-columns: repeat(2, 1fr); } .brand-sub { display: none; } .header-top { flex-wrap: wrap; } }

/* Tablet-first workspace: the drawing area fits between persistent side panels. */
body { min-height: 100dvh; }
header { padding: 10px 18px; gap: 9px; }
.brand-title { font-size: 20px; }.brand-sub { font-size: 13px; }
.pill-btn,.mode-tab,.btn,.lesson-btn,.tool-btn { font-size: 15px; min-height: 44px; }
.mode-tabs { display:flex; width:max-content; max-width:100%; align-self:center; }
.mode-tab { padding: 8px 18px; }
.experience-bar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 18px; }
.experience-bar>span { font-size:14px; color:var(--muted); }
.experience-switch { display:flex; padding:4px; background:#F1EDE5; border-radius:14px; gap:4px; }
.experience-switch button { border:0; padding:6px 14px; background:transparent; border-radius:10px; color:var(--muted); font-weight:800; font-size:15px; min-height:40px; cursor:pointer; }
.experience-switch button.active { background:#fff; color:var(--primary-dk); box-shadow:0 2px 6px #0001; }
.workspace { padding:0 12px 12px; gap:12px; align-items:stretch; max-width:1800px; }
.panel { padding:12px; gap:10px; }.section-title { font-size:16px; flex-wrap:wrap; gap:5px; }
.coach-panel .section-title { flex-direction:column; align-items:flex-start; }
.lesson-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
.lesson-btn { padding:6px 2px; font-size:14px; }
.coach-row { flex-direction:column; gap:10px; }.preview-box { width:100%; padding:6px; }
.step-info { width:100%; }.step-tip { font-size:15px; line-height:1.6; min-height:76px; }
.teacher-actions { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.teacher-actions .btn { padding:5px 2px; font-size:14px; }
.btn-row .btn { padding:5px 4px; }
.toggles-bar { font-size:13px; gap:4px 8px; }.toggles-bar label { min-height:36px; }
input[type=checkbox] { width:19px; height:19px; min-height:19px; accent-color:var(--primary); }
.size-control { display:flex; align-items:center; gap:6px; font-size:14px; flex-wrap:wrap; }.size-control input { width:100%; accent-color:var(--sec); }
.tool-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }.tool-btn { min-height:58px; padding:6px 2px; }.tool-btn span { font-size:23px; }
.palette { grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; padding:6px 2px; }.swatch { max-width:42px; }
.mixer { flex-direction:column; gap:9px; }.mixer-slots { justify-content:center; }.slot { width:34px; height:34px; }
.drawing-options { display:flex; align-items:center; gap:7px 14px; flex-wrap:wrap; padding:8px 12px; font-size:13px; }
.drawing-options label { display:flex; align-items:center; gap:5px; min-height:30px; }
#drawingStatus { color:var(--muted); font-size:13px; }
.stage { min-height:0; background:#EBF0F4; }.toolbar { padding:8px; gap:6px; }.toolbar .btn { padding:6px 10px; font-size:14px; white-space:nowrap; }
.canvas-space { flex:1; min-height:0; display:flex; justify-content:center; align-items:center; padding:10px; container-type:size; }
.canvas-wrap { margin:0; width:min(100cqw, calc(100cqh * 4 / 3)); height:auto; aspect-ratio:4/3; max-height:none; flex:none; border-radius:12px; }
#demoCanvas { pointer-events:none; }
.canvas-footer { padding:8px 12px; display:flex; align-items:center; gap:10px; justify-content:space-between; background:#fff; border-top:1px solid var(--border); }
.canvas-footer>span { font-size:13px; color:var(--muted); }.canvas-footer .btn { flex:none; font-size:14px; }
.free-coach { display:none; }.free-hero { font-size:64px; text-align:center; padding:18px 0; }.free-coach h2 { font-size:20px; }.free-coach p { font-size:16px; line-height:1.8; color:var(--muted); }.free-coach .btn { flex:none; }
body.free-mode .mode-tabs { display:none; }body.free-mode .coach-panel { display:none; }body.free-mode .free-coach { display:flex; }
body.free-mode .tools-panel .mixer,body.free-mode .tools-panel .badge,body.free-mode #b-water,body.free-mode #b-pencil { display:none; }
body.free-mode .tool-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
body.free-mode .tool-btn { min-height:72px; font-size:17px; }
@media(min-width:960px) and (min-height:500px) {
 body { height:100dvh; overflow:hidden; }
 header { flex:none; }.header-top { gap:20px; }.brand-sub { display:block; }
 .workspace { flex:1; min-height:0; grid-template-columns:224px minmax(0,1fr) 190px; }
 .panel { overflow-y:auto; min-height:0; scrollbar-width:thin; }
 .mode-tabs { align-self:flex-start; }.mode-tab { min-height:38px; padding:5px 20px; }
 .coach-panel .preview-box { max-width:210px; align-self:center; }
}
@media(min-width:1200px) and (min-height:500px) { .workspace { grid-template-columns:250px minmax(0,1fr) 220px; } }
@media(min-width:700px) and (max-width:959px) {
 .workspace { grid-template-columns:minmax(0,1fr) 190px; }
 .coach-panel,.free-coach { grid-column:1/-1; }.coach-panel { display:grid; grid-template-columns:190px minmax(0,1fr); align-items:start; }
 .coach-panel .section-title { grid-column:1/-1; flex-direction:row; }.coach-panel .coach-row { flex-direction:row; }.coach-panel .preview-box { width:150px; }.coach-panel .toggles-bar { grid-column:1/-1; }
 .stage { min-height:520px; }.canvas-space { min-height:380px; }.tools-panel { grid-column:2; }.free-coach { flex-direction:row; align-items:center; flex-wrap:wrap; }.free-hero { font-size:40px; padding:0; }
}
@media(max-width:699px) {
 header { padding:10px; }.brand-title { font-size:18px; }.brand-sub { display:none; }.pill-btn { font-size:13px; padding:4px 8px; }
 .mode-tabs { display:grid; grid-template-columns:repeat(2,1fr); width:100%; }.mode-tab { font-size:14px; padding:5px; }
 .experience-bar { padding:8px 10px; }.experience-bar>span { display:none; }.experience-switch { width:100%; }.experience-switch button { flex:1; }
 .workspace { display:flex; flex-direction:column; padding:0 8px 8px; gap:8px; }.coach-panel .coach-row { flex-direction:row; }.coach-panel .preview-box { width:90px; }.coach-panel .lesson-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
 .step-tip { min-height:0; font-size:14px; }.teacher-actions .btn { font-size:13px; }.stage { height:500px; min-height:440px; flex:none; }.canvas-space { min-height:260px; }
 .tools-panel .tool-grid { grid-template-columns:repeat(6,minmax(0,1fr)); }.tools-panel .tool-btn { font-size:12px; }.palette { grid-template-columns:repeat(6,minmax(0,1fr)); }.mixer { flex-direction:row; }.size-control input { width:50%; }.drawing-options { padding:6px 8px; }.canvas-footer>span { max-width:55%; }
}


/* Visual language from the original Little Art classroom. */
:root { --bg:#F7F3E8; --primary:#356F59; --primary-dk:#285944; --sec:#6E927D; --yellow:#E6C979; --text:#293D33; --muted:#737D70; --border:#E3E1D5; }
header { background:var(--bg); color:var(--text); box-shadow:none; padding-top:max(12px,env(safe-area-inset-top)); }
.brand-icon { background:#356F59; border-radius:13px; width:42px; height:42px; font-size:27px; }
.brand-title { font-weight:800; letter-spacing:.03em; }.brand-sub { color:#7C8376; opacity:1; }
.pill-btn { background:#FFFEF9; color:var(--text); border:1px solid var(--border); border-radius:13px; }
.mode-tabs { background:transparent; padding:0; gap:7px; }
.mode-tab { background:#FFFEF9; color:#526458; border:1px solid var(--border); border-radius:14px; font-weight:600; }
.mode-tab.active { background:var(--primary); color:#fff; border-color:var(--primary); box-shadow:none; }
.experience-bar { background:#E7EDDD; border-radius:16px; margin:0 12px 10px; padding:8px 12px; }
.experience-switch { background:transparent; padding:0; }.experience-switch button { font-weight:700; }.experience-switch button.active { background:#FFFEF9; color:var(--primary-dk); box-shadow:none; }
.panel { background:#FFFEF9; border:1px solid var(--border); border-radius:20px; box-shadow:none; }
.stage { border:1px solid var(--border); border-radius:20px; background:#ECEFE5; }
.toolbar,.canvas-footer { background:#FFFEF9; border-color:var(--border); }.toolbar { border-bottom:1px solid var(--border); }
.btn { border-radius:11px; font-weight:600; }.btn-pri,.btn-acc { background:var(--primary); color:#fff; }.btn-sec { background:#F0EEE5; color:#425A49; }
.lesson-btn { border:1px solid var(--border); background:#FFFEF9; border-radius:12px; font-weight:600; }.lesson-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); }
.preview-box { background:#F4F5EB; border:1px dashed #C8D3C2; border-radius:14px; }.step-tip { background:#F2ECD9; color:#3E4F40; border:0; border-radius:12px; }
.tool-btn { border:1px solid var(--border); border-radius:12px; color:#506454; background:#FFFEF9; }.tool-btn.active { background:#E4EDDF; border-color:#6B947B; color:#285944; }
.mixer { background:#F2F3E9; border-color:var(--border); border-radius:14px; }.badge { background:#F0EFE7; color:#7B8174; }.badge.on { background:#EEE5C9; color:#715B26; border-color:#DDCEA5; }
.canvas-wrap { border:1px solid #DDE2D9; box-shadow:0 4px 15px #365B4510; }.free-hero { background:#E9EFDF; border-radius:16px; }.toast { background:#304E3C; }


.palette-heading { display:flex; justify-content:space-between; align-items:center; font-size:13px; font-weight:700; color:#526458; margin-top:3px; }
.palette-heading>span:last-child { font-size:12px; color:#7B8174; }
.palette-tabs { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:4px; padding:3px; border-radius:11px; background:#F0EEE5; }
.palette-tabs button { min-height:40px; padding:4px 0; border:0; border-radius:9px; background:transparent; color:#637264; font-size:14px; font-weight:700; cursor:pointer; }
.palette-tabs button.active { background:#356F59; color:white; }
.palette { grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; padding:5px 2px; }
.palette .swatch { min-height:0; min-width:0; width:100%; max-width:42px; aspect-ratio:1; padding:0; border:2px solid #fff; box-shadow:0 0 0 1px #DDDCD1,0 2px 4px #0001; }
.palette .swatch.active { outline:3px solid #356F59; outline-offset:1px; transform:scale(1.03); }
.palette .swatch:focus-visible,.palette-tabs button:focus-visible { outline:3px solid #356F59; outline-offset:3px; }

<body>
<header>
  <div class="header-top">
    <div class="brand">
      <div class="brand-icon">🎨</div>
      <div>
        <div class="brand-title">小小畫畫教室</div>

      </div>
    </div>
    <div class="header-btns">
      <button class="pill-btn focus-button" id="focusBtn" onclick="toggleFocus()" aria-pressed="false">放大畫布</button>
      <button class="pill-btn" onclick="openPanel('settingsModal')">更多設定</button>
      <button class="pill-btn" onclick="openGallery()">🖼️ 作品集 (<span id="galCnt">0</span>)</button>
      <button class="pill-btn" onclick="installApp()">📲 安裝</button>
    </div>
  </div>
  <div class="mode-tabs">
    <button class="mode-tab active" onclick="setMode('step')" id="tab-step">📐 分步拆解</button>
    <button class="mode-tab" onclick="setMode('grid')" id="tab-grid">🔍 網格觀察</button>
    <button class="mode-tab" onclick="setMode('symmetry')" id="tab-symmetry">🦋 對稱遊戲</button>
    <button class="mode-tab" onclick="setMode('color')" id="tab-color">🌈 混色創作</button>
  </div>
</header>

<div class="experience-bar">

  <span id="experienceHint">先看示範，再換你畫！</span>
</div>
<div class="workspace">
  <!-- Coach Panel -->
  <aside class="panel coach-panel">
    <div class="section-title">
      <span>📚 我的畫畫老師</span>
      <span id="stepBadge" style="color:var(--primary);font-size:0.76rem">🐱 幾何小貓 · 第 1/4 步</span>
    </div>
    <div class="lesson-grid">
      <button class="lesson-btn" onclick="setLesson('lines')" id="les-lines">〰️ 線條練習</button>
      <button class="lesson-btn" onclick="setLesson('shapes')" id="les-shapes">🔵 形狀積木</button>
      <button class="lesson-btn active" onclick="setLesson('cat')" id="les-cat">🐱 小貓</button>
      <button class="lesson-btn" onclick="setLesson('rocket')" id="les-rocket">🚀 火箭</button>
      <button class="lesson-btn" onclick="setLesson('dino')" id="les-dino">🦕 恐龍</button>
      <button class="lesson-btn" onclick="setLesson('fox')" id="les-fox">🦊 狐狸</button>
    </div>
    <div class="coach-row">
      <div class="preview-box">
        <canvas id="miniCanvas" width="160" height="120" style="width:100%;height:auto;aspect-ratio:4/3;background:#fff;border-radius:6px"></canvas>
      </div>
      <div class="step-info">
        <div class="step-tip" id="stepTip"></div>
        <div class="teacher-actions"><button class="btn btn-acc" onclick="playDemo()">▶ 看老師畫</button><button class="btn btn-sec" onclick="speakTip()" aria-label="朗讀這一步">🔊 聽說明</button></div>
        <div class="btn-row">
          <button class="btn btn-sec" onclick="step(-1)">上一筆</button>
          
          <button class="btn btn-pri" onclick="step(1)">下一筆</button>
        </div>
      </div>
    </div>
    <div class="toggles-bar">
      <label><input type="checkbox" id="autoVoice"> 自動讀步驟</label>
      <label><input type="checkbox" id="guideChk" checked onchange="drawOverlays()"> 👁️ 描紅線</label>
      <label>透明度 <input type="range" id="guideAlpha" min="15" max="85" value="42" style="width:65px" oninput="drawOverlays()"></label>
      <label><input type="checkbox" id="gridChk" onchange="drawOverlays()"> 📏 九宮格</label>
      <label>🦋 <select id="symSel" onchange="drawOverlays()" style="padding:2px 4px;border-radius:6px;font-size:0.75rem">
        <option value="none">無對稱</option>
        <option value="v">左右對稱</option>
        <option value="q">四向對稱</option>
      </select></label>
    </div>
  </aside>

  <aside class="panel free-coach"><div class="section-title">🎈 今天想畫什麼？</div><div class="free-hero">🌻</div><h2>沒有標準答案</h2><p>選個喜歡的顏色，畫一朵花、一隻怪獸，或你想像中的世界！</p><button class="btn btn-acc" onclick="freeSymmetry()">🦋 試試對稱魔法</button><button class="btn btn-sec" onclick="speakText('選一個喜歡的顏色，畫出你想像中的世界吧！')">🔊 聽聽小提示</button></aside>

  <main class="stage">

      <div style="display:flex;gap:5px">

        <button class="btn btn-sec" onclick="confirmClear()">🗑️ 清空</button>
      </div>
      <div style="display:flex;gap:5px">
        <button class="btn btn-acc" onclick="saveArt()">⭐ 收藏</button>
        <button class="btn btn-pri" onclick="dlArt()">💾 下載</button>
      </div>
    </div>
    <div class="drawing-options"><label><input id="penOnly" type="checkbox"> 只用觸控筆</label><label><input id="pressureChk" type="checkbox" checked> 感壓粗細</label><span id="drawingStatus" role="status">準備好，就畫第一筆吧！</span></div>

  </main>

  <!-- Tools & Palette Panel -->
  <aside class="panel tools-panel">
    <div class="section-title">🖌️ 我的畫具</div>

    <div class="tool-grid">
      <button class="tool-btn active" onclick="setBrush('pencil')" id="b-pencil"><span>✏️</span>鉛筆</button>
      <button class="tool-btn" onclick="setBrush('marker')" id="b-marker"><span>🖍️</span>麥克筆</button>
      <button class="tool-btn" onclick="setBrush('water')" id="b-water"><span>💧</span>水彩筆</button>
      <button class="tool-btn" onclick="setBrush('crayon')" id="b-crayon"><span>🖍️</span>蠟筆</button>
      <button class="tool-btn" onclick="setBrush('star')" id="b-star"><span>⭐</span>星星筆</button>
      <button class="tool-btn" onclick="setBrush('eraser')" id="b-eraser"><span>🧽</span>橡皮擦</button>
    </div>
    <div class="palette-heading"><span>🎨 選個喜歡的顏色</span><span>36 色</span></div>
    <div class="palette-tabs" role="group" aria-label="色彩分類"><button class="active" id="colors-basic" onclick="showPalette('basic')" aria-pressed="true">基本</button><button id="colors-pastel" onclick="showPalette('pastel')" aria-pressed="false">粉彩</button><button id="colors-nature" onclick="showPalette('nature')" aria-pressed="false">自然</button></div>
    <div class="palette" id="pal" role="group" aria-label="基本色調色盤"></div>
    <div class="custom-color-row"><label for="customColor">＋ 自選顏色</label><input id="customColor" type="color" value="#2b2d42" aria-label="自選畫筆顏色" oninput="chooseColor(this.value,'我的顏色')"></div>
    <div class="current-color" aria-live="polite"><span id="currentColorPreview" style="background:#2B2D42"></span><span id="currentColorName">正在用：墨黑</span></div>
    <div class="mixer">
      <div>
        <div style="font-size:0.76rem;font-weight:800">🧪 顏料混色實驗</div>
        <div id="mixTxt" style="font-size:0.7rem;color:var(--muted)">混色示意，點方塊使用</div>
      </div>
      <div class="mixer-slots">
        <div class="slot" id="slotA" style="background:#FF595E" onclick="mix('A')"></div><b>+</b>
        <div class="slot" id="slotB" style="background:#FFCA3A" onclick="mix('B')"></div><b>=</b>
        <div class="mix-out" id="mixOut" style="background:#FF924C" onclick="useMix()"></div>
      </div>
    </div>
    <div>
      <span class="badge" id="bg-first">🎨 第一筆</span>
      <span class="badge" id="bg-step">📐 練習完成</span>
      <span class="badge" id="bg-mix">🧪 混色達人</span>
      <span class="badge" id="bg-sym">🦋 對稱大師</span>
      <span class="badge" id="bg-save">🖼️ 收藏家</span>
    </div>

</div>

<div class="modal" id="galModal">

  </div>
</div>

<script>

let pointerPressure=1,practiceStrokes=0,experience='learn',mode='step',hasInk=false;
// Cache a paper-grain wax texture; fixed canvas coordinates keep grain stable
// across slow/fast pointer events and repeated strokes deepen the pigment.
let crayonColor=null,crayonPattern=null;
function crayonTexture(color){
  if(crayonPattern&&crayonColor===color)return crayonPattern;
  const tile=document.createElement('canvas');tile.width=tile.height=64;
  const ctx=tile.getContext('2d');ctx.fillStyle=color;
  ctx.globalAlpha=.18;ctx.fillRect(0,0,64,64);
  let seed=7391;
  const random=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};
  for(let i=0;i<2600;i++){
    const x=random()*64,y=random()*64;
    ctx.globalAlpha=.2+random()*.6;
    ctx.fillRect(x,y,.5+random()*1.2,.5+random()*1.2);
  }
  crayonColor=color;crayonPattern=dctx.createPattern(tile,'repeat');
  return crayonPattern;
}
function stroke(p1,p2){
  const sym=document.getElementById('symSel').value,w=dc.width,h=dc.height;
  const seg=(a,b)=>{
    dctx.save();dctx.lineCap='round';dctx.lineJoin='round';
    const effectiveSize=sz*pointerPressure;let lw=effectiveSize;
    if(brush==='pencil'){dctx.globalAlpha=.85;dctx.strokeStyle=col}
    else if(brush==='marker'){lw=effectiveSize*1.4;dctx.strokeStyle=col}
    else if(brush==='water'){lw=effectiveSize*2;dctx.globalAlpha=.16;dctx.strokeStyle=col;dctx.shadowColor=col;dctx.shadowBlur=6}
    else if(brush==='crayon'){dctx.strokeStyle=crayonTexture(col);lw=effectiveSize*1.6}
    else if(brush==='eraser'){dctx.strokeStyle='#FFFFFF';lw=effectiveSize*2.2}
    else if(brush==='star'){if(p1===p2||Math.hypot(b.x-a.x,b.y-a.y)>0){dctx.fillStyle=col;dctx.font=(sz*2)+'px sans-serif';dctx.fillText('★',b.x-sz,b.y+sz)}dctx.restore();return}
    dctx.lineWidth=lw;dctx.beginPath();dctx.moveTo(a.x,a.y);dctx.lineTo(b.x,b.y);dctx.stroke();dctx.restore();
  };
  seg(p1,p2);
  if(sym==='v'||sym==='q'){badge('bg-sym');seg({x:w-p1.x,y:p1.y},{x:w-p2.x,y:p2.y})}
  if(sym==='q'){seg({x:p1.x,y:h-p1.y},{x:p2.x,y:h-p2.y});seg({x:w-p1.x,y:h-p1.y},{x:w-p2.x,y:h-p2.y})}
}
let activePointer=null;
function point(e){const r=dc.getBoundingClientRect();return {x:(e.clientX-r.left)*dc.width/r.width,y:(e.clientY-r.top)*dc.height/r.height}}
dc.onpointerdown=e=>{if(activePointer!==null||e.button>0||(document.getElementById('penOnly').checked&&e.pointerType!=='pen'))return;stopDemo();updatePressure(e);e.preventDefault();historyVersion++;activePointer=e.pointerId;dc.setPointerCapture(e.pointerId);drawing=true;last=point(e);stroke(last,last);badge('bg-first')};
dc.onpointermove=e=>{if(!drawing||e.pointerId!==activePointer)return;updatePressure(e);const p=point(e);stroke(last,p);last=p};
function endStroke(e){if(e.pointerId!==activePointer)return;drawing=false;activePointer=null;last=null;practiceStrokes++;hasInk=true;pushHist();document.getElementById('drawingStatus').textContent='畫得很好，照自己的速度慢慢來。'}
dc.onpointerup=endStroke;dc.onpointercancel=endStroke;dc.onlostpointercapture=endStroke;

function drawOverlays(skipCurrent=false){
  const w=gc.width,h=gc.height;gctx.clearRect(0,0,w,h);grctx.clearRect(0,0,w,h);
  const les=LESSONS[curLes];
  if(document.getElementById('guideChk').checked){
    gctx.save();gctx.globalAlpha=document.getElementById('guideAlpha').value/100;gctx.lineCap='round';
    for(let i=0;i<=curStep;i++){
      if(skipCurrent&&i===curStep)continue;
      gctx.lineWidth=i===curStep?4.5:2.5;gctx.setLineDash(i===curStep?[8,6]:[]);
      gctx.strokeStyle=i===curStep?'#598D78':'#A7B4A8';les.steps[i].fn(gctx,w,h);
    }
    gctx.restore();
  }
  if(document.getElementById('gridChk').checked){
    grctx.save();grctx.strokeStyle='rgba(62,193,211,.55)';grctx.lineWidth=1.5;grctx.setLineDash([6,6]);
    for(let i=1;i<=2;i++){grctx.beginPath();grctx.moveTo(w/3*i,0);grctx.lineTo(w/3*i,h);grctx.moveTo(0,h/3*i);grctx.lineTo(w,h/3*i);grctx.stroke()}
    grctx.restore();
  }
  const sym=document.getElementById('symSel').value;
  if(sym!=='none'){
    grctx.save();grctx.strokeStyle='rgba(131,56,236,.5)';grctx.lineWidth=2;grctx.setLineDash([8,6]);
    grctx.beginPath();grctx.moveTo(w/2,0);grctx.lineTo(w/2,h);if(sym==='q'){grctx.moveTo(0,h/2);grctx.lineTo(w,h/2)}grctx.stroke();grctx.restore();
  }
  const mc=document.getElementById('miniCanvas'),mctx=mc.getContext('2d');
  mctx.clearRect(0,0,mc.width,mc.height);mctx.lineCap='round';
  for(let i=0;i<=curStep;i++){mctx.lineWidth=i===curStep?3:2;mctx.strokeStyle=i===curStep?'#38735D':'#697A6F';les.steps[i].fn(mctx,mc.width,mc.height)}
  document.getElementById('stepBadge').textContent=`${les.name} · 第 ${curStep+1}/${les.steps.length} 步`;
  document.getElementById('stepTip').textContent=les.steps[curStep].tip;
}

function mix(s){
  if(s==='A')mA=(mA+1)%MIXES.length;else if(s==='B')mB=(mB+1)%MIXES.length;
  const a=MIXES[mA],b=MIXES[mB];
  document.getElementById('slotA').style.background=a.h;document.getElementById('slotB').style.background=b.h;
  const pairs={'0,1':'#FF924C','0,2':'#8B4CB2','1,2':'#60A83B'};const key=[mA,mB].sort().join(',');
  const hex=pairs[key]||'#'+[a.r+b.r,a.g+b.g,a.b+b.b].map(x=>Math.round(x/2).toString(16).padStart(2,'0')).join('');
  const out=document.getElementById('mixOut');out.style.background=hex;out.dataset.hex=hex;
  document.getElementById('mixTxt').textContent=`${a.n}+${b.n} = 點右側方塊使用`;if(s!=='init')badge('bg-mix');
}

function saveArt(){

// Sample the same lesson geometry into short segments, then reveal them in stroke order.
function lessonPaths(fn,w,h){
  const paths=[];let path=[],x=0,y=0,sx=0,sy=0;
  function move(a,b){if(path.length>1)paths.push(path);path=[{x:a,y:b}];x=sx=a;y=sy=b;}
  function line(a,b){if(!path.length){move(a,b);return;}const ox=x,oy=y,n=Math.max(1,Math.ceil(Math.hypot(a-x,b-y)/5));for(let i=1;i<=n;i++)path.push({x:ox+(a-ox)*i/n,y:oy+(b-oy)*i/n});x=a;y=b;}
  const c={beginPath(){if(path.length>1)paths.push(path);path=[];},moveTo:move,lineTo:line,closePath(){line(sx,sy)},stroke(){if(path.length>1)paths.push(path);path=[];},
    arc(cx,cy,r,a,b){this.ellipse(cx,cy,r,r,0,a,b)},
    ellipse(cx,cy,rx,ry,rot,a,b){const end=Math.min(b,a+Math.PI*2),n=Math.max(16,Math.ceil((end-a)*Math.max(rx,ry)/5));for(let i=0;i<=n;i++){const t=a+(end-a)*i/n,px=cx+rx*Math.cos(t)*Math.cos(rot)-ry*Math.sin(t)*Math.sin(rot),py=cy+rx*Math.cos(t)*Math.sin(rot)+ry*Math.sin(t)*Math.cos(rot);if(i===0&&!path.length)move(px,py);else line(px,py)}},
    quadraticCurveTo(cx,cy,ex,ey){const ox=x,oy=y;for(let i=1;i<=40;i++){const t=i/40;line((1-t)**2*ox+2*(1-t)*t*cx+t*t*ex,(1-t)**2*oy+2*(1-t)*t*cy+t*t*ey)}},
    bezierCurveTo(ax,ay,bx,by,ex,ey){const ox=x,oy=y;for(let i=1;i<=50;i++){const t=i/50;line((1-t)**3*ox+3*(1-t)**2*t*ax+3*(1-t)*t*t*bx+t**3*ex,(1-t)**3*oy+3*(1-t)**2*t*ay+3*(1-t)*t*t*by+t**3*ey)}},
    rect(a,b,rw,rh){move(a,b);line(a+rw,b);line(a+rw,b+rh);line(a,b+rh);line(a,b)}
  };fn(c,w,h);if(path.length>1)paths.push(path);return paths;
}
function playDemo(){
  stopDemo();const canvas=document.getElementById('demoCanvas'),c=canvas.getContext('2d');
  const paths=lessonPaths(LESSONS[curLes].steps[curStep].fn,canvas.width,canvas.height);const count=paths.reduce((a,p)=>a+p.length,0);if(!count)return;
  demoRunning=true;drawOverlays(true);const start=performance.now(),duration=Math.min(6500,Math.max(2200,count*13));
  document.getElementById('drawingStatus').textContent='看小圓點怎麼走，再換你試試！';
  function frame(now){
    if(!demoRunning)return;c.clearRect(0,0,canvas.width,canvas.height);let remain=Math.ceil(Math.min(1,(now-start)/duration)*count),tip=null;
    c.strokeStyle='#39765F';c.lineWidth=7;c.lineCap='round';c.lineJoin='round';
    for(const p of paths){const n=Math.min(remain,p.length);if(n<=0)break;c.beginPath();c.moveTo(p[0].x,p[0].y);for(let i=1;i<n;i++)c.lineTo(p[i].x,p[i].y);c.stroke();tip=p[n-1];remain-=n;}
    if(tip){c.fillStyle='#FFCA3A';c.strokeStyle='#7D4823';c.lineWidth=2;c.beginPath();c.arc(tip.x,tip.y,11,0,Math.PI*2);c.fill();c.stroke();}
    if(now-start<duration)demoFrame=requestAnimationFrame(frame);else{stopDemo();document.getElementById('drawingStatus').textContent='換你畫畫看！想再看一次就按「看老師畫」。';}
  }demoFrame=requestAnimationFrame(frame);autoSpeak();
}
function setExperience(k){
  stopDemo();experience=k;document.body.classList.toggle('free-mode',k==='free');

  document.getElementById('finishBtn').textContent=k==='free'?'⭐ 收藏這幅畫':'✓ 我畫好了';
  document.getElementById('practiceHint').textContent=k==='free'?'每個想法，都可以畫出來。':'畫錯沒關係，可以按復原再試一次。';

  else setMode('step');drawOverlays();
}

  if(experience==='free'){saveArt();return;}
  if(!practiceStrokes){toast('先在畫布上試著畫幾筆，再來完成練習吧！');return;}
  if(curStep<LESSONS[curLes].steps.length-1){step(1);toast('這一步練習完成！一起看看下一筆。');}
  else{badge('bg-step');toast('你完成了一次練習！喜歡的話，可以收藏作品。');document.getElementById('drawingStatus').textContent='練習完成！這是你自己畫出來的作品。';}
  practiceStrokes=0;
}

}

// Visual viewport height accounts for Safari's expanding address and tab bars.
// Do not resize the workspace during a user's accessibility pinch zoom.
function fitViewport(){
 const viewport=window.visualViewport;
 if(!viewport||Math.abs(viewport.scale-1)<.02)
   document.documentElement.style.setProperty('--app-height',Math.round(viewport?viewport.height:window.innerHeight)+'px');
}
function fitDrawingDesk(){
 const space=document.querySelector('.canvas-space'),wrap=document.getElementById('wrap');
 const s=getComputedStyle(space);
 const width=space.clientWidth-parseFloat(s.paddingLeft)-parseFloat(s.paddingRight);
 const height=space.clientHeight-parseFloat(s.paddingTop)-parseFloat(s.paddingBottom);
 if(width>0&&height>0){
   const w=Math.max(1,Math.floor(Math.min(width,height*4/3)));
   wrap.style.width=w+'px';wrap.style.height=Math.floor(w*3/4)+'px';
 }
 const tools=document.querySelector('.tools-panel');
 tools.classList.toggle('compact-tools',tools.clientHeight<600);
}
fitViewport();

if(window.visualViewport)window.visualViewport.addEventListener('resize',fitViewport);

deskObserver.observe(document.querySelector('.tools-panel'));
