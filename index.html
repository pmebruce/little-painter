<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#FF7A59">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>小畫家魔法學院 — 兒童繪畫技巧學習 PWA</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<style>
:root {
  --bg: #FFFDF7;
  --primary: #FF7A59;
  --primary-dk: #E05A3A;
  --sec: #3EC1D3;
  --yellow: #FFD166;
  --text: #2B2D42;
  --muted: #5C6378;
  --border: #E2E8F0;
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}
header {
  background: linear-gradient(135deg, #FF7A59 0%, #FF9F1C 100%);
  color: #fff;
  padding: 10px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-shadow: 0 3px 10px rgba(255, 122, 89, 0.25);
  z-index: 10;
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand-icon {
  width: 34px;
  height: 34px;
  background: #fff;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 19px;
  flex-shrink: 0;
}
.brand-title {
  font-weight: 800;
  font-size: 1.05rem;
  line-height: 1.2;
}
.brand-sub {
  font-size: 0.7rem;
  opacity: 0.92;
}
.header-btns {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}
.pill-btn {
  border: none;
  background: rgba(255, 255, 255, 0.24);
  color: #fff;
  padding: 6px 10px;
  border-radius: 9px;
  font-size: 0.875rem;
  font-weight: 700;
  cursor: pointer;
}
.mode-tabs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 5px;
  background: rgba(255, 255, 255, 0.2);
  padding: 4px;
  border-radius: 11px;
}
.mode-tab {
  border: none;
  background: transparent;
  color: #fff;
  font-weight: 700;
  font-size: 0.875rem;
  padding: 8px 4px;
  border-radius: 8px;
  cursor: pointer;
  text-align: center;
  white-space: nowrap;
}
.mode-tab.active {
  background: #fff;
  color: var(--primary-dk);
  box-shadow: 0 2px 6px rgba(0,0,0,0.12);
}

/* Main Content Grid */
.workspace {
  flex: 1;
  display: grid;
  grid-template-columns: 280px 1fr 240px;
  gap: 10px;
  padding: 10px;
  max-width: 1400px;
  width: 100%;
  margin: 0 auto;
}
@media (max-width: 900px) {
  .workspace {
    grid-template-columns: 1fr;
    gap: 8px;
    padding: 8px;
  }
}
.panel {
  background: #fff;
  border-radius: 16px;
  border: 2px solid var(--border);
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-shadow: 0 4px 12px rgba(43, 45, 66, 0.05);
}
.section-title {
  font-size: 0.84rem;
  font-weight: 800;
  color: var(--text);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.lesson-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}
@media (min-width: 901px) {
  .lesson-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}
.lesson-btn {
  border: 2px solid var(--border);
  background: #FFFDF9;
  border-radius: 9px;
  padding: 8px 4px;
  cursor: pointer;
  font-weight: 700;
  font-size: 0.875rem;
  text-align: center;
}
.lesson-btn.active {
  border-color: var(--primary);
  background: #FFF3EF;
  color: var(--primary-dk);
}
.coach-row {
  display: flex;
  gap: 10px;
  align-items: center;
}
.preview-box {
  background: #F8FAFF;
  border: 2px dashed #CBD5E1;
  border-radius: 10px;
  padding: 4px;
  width: 110px;
  flex-shrink: 0;
  text-align: center;
}
@media (min-width: 901px) {
  .coach-row {
    flex-direction: column;
  }
  .preview-box {
    width: 100%;
  }
}
.step-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.step-tip {
  background: #FFF9DB;
  border-left: 4px solid var(--yellow);
  padding: 7px 9px;
  border-radius: 7px;
  font-size: 0.8rem;
  line-height: 1.38;
}
.btn-row {
  display: flex;
  gap: 6px;
  justify-content: space-between;
}
.btn {
  border: none;
  border-radius: 8px;
  padding: 7px 10px;
  font-weight: 700;
  font-size: 0.875rem;
  cursor: pointer;
  flex: 1;
  text-align: center;
}
.btn-pri { background: var(--primary); color: #fff; }
.btn-sec { background: #EDF2F7; color: var(--text); }
.btn-acc { background: var(--sec); color: #fff; }

.toggles-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 12px;
  align-items: center;
  justify-content: space-between;
  font-size: 0.76rem;
  font-weight: 700;
  color: var(--muted);
  border-top: 1px solid var(--border);
  padding-top: 6px;
}
.toggles-bar label {
  display: flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
}

/* Canvas Area */
.stage {
  background: #EEF2F6;
  border-radius: 16px;
  border: 2px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.toolbar {
  background: #fff;
  padding: 7px 10px;
  border-bottom: 2px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.canvas-wrap {
  position: relative;
  aspect-ratio: 4 / 3;
  width: min(calc(100% - 16px), calc(56dvh * 4 / 3));
  max-height: 56dvh;
  align-self: center;
  margin: 8px;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.06);
  overflow: hidden;
}
@media (min-width: 901px) {
  .canvas-wrap {
    width: calc(100% - 16px);
    height: auto;
    max-height: none;
    min-height: 0;
  }
}
canvas.layer {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  touch-action: none;
  cursor: crosshair;
}
#guideCanvas, #gridCanvas {
  pointer-events: none;
}

/* Brushes & Colors */
.tool-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 5px;
}
@media (min-width: 901px) {
  .tool-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}
.tool-btn {
  border: 2px solid var(--border);
  background: #fff;
  border-radius: 10px;
  padding: 6px 2px;
  font-size: 0.875rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.tool-btn.active {
  border-color: var(--sec);
  background: #EBFBFD;
  color: #0B7285;
}
.palette {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 7px;
  padding: 2px 0;
}
@media (min-width: 901px) {
  .palette {
    grid-template-columns: repeat(4, 1fr);
  }
}
.swatch {
  width: 100%;
  aspect-ratio: 1;
  max-width: 36px;
  margin: 0 auto;
  border-radius: 50%;
  border: 2px solid #fff;
  box-shadow: 0 2px 5px rgba(0,0,0,0.16);
  cursor: pointer;
}
.swatch.active {
  transform: scale(1.15);
  outline: 2px solid var(--text);
}
.mixer {
  background: #F8FAFC;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 7px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}
.mixer-slots {
  display: flex;
  align-items: center;
  gap: 5px;
}
.slot {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 2px solid #fff;
  box-shadow: 0 2px 5px rgba(0,0,0,0.15);
  cursor: pointer;
}
.mix-out {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  border: 2px solid #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,0.18);
  cursor: pointer;
}
.badge {
  font-size: 0.7rem;
  padding: 3px 7px;
  border-radius: 12px;
  background: #F1F5F9;
  color: #64748B;
  font-weight: 700;
  display: inline-block;
  margin: 2px;
}
.badge.on {
  background: #FEF3C7;
  color: #B45309;
  border: 1px solid #F59E0B;
}
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 99;
  padding: 16px;
}
.modal.open { display: flex; }
.modal-card {
  background: #fff;
  border-radius: 16px;
  max-width: 520px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  padding: 16px;
}
.toast {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%) translateY(70px);
  background: #2B2D42;
  color: #fff;
  padding: 8px 16px;
  border-radius: 20px;
  font-weight: 700;
  font-size: 0.82rem;
  transition: 0.25s;
  z-index: 120;
  white-space: nowrap;
}
.toast.show {
  transform: translateX(-50%) translateY(0);
}
button, select, input { min-height: 36px; }
.panel, .stage, .step-info { min-width: 0; }
.toast { white-space: normal; text-align: center; width: max-content; max-width: 92vw; }
@media (max-width: 420px) { .mode-tabs { grid-template-columns: repeat(2, 1fr); } .brand-sub { display: none; } .header-top { flex-wrap: wrap; } }
</style>
</head>
<body>
<header>
  <div class="header-top">
    <div class="brand">
      <div class="brand-icon">🎨</div>
      <div>
        <div class="brand-title">小畫家魔法學院</div>
        <div class="brand-sub">兒童繪畫技巧學習 PWA · 支援觸控與感壓筆</div>
      </div>
    </div>
    <div class="header-btns">
      <button class="pill-btn" onclick="openGallery()">🖼️ 作品集 (<span id="galCnt">0</span>)</button>
      <button class="pill-btn" onclick="installApp()">📲 安裝</button>
    </div>
  </div>
  <div class="mode-tabs">
    <button class="mode-tab active" onclick="setMode('step')" id="tab-step">📐 分步拆解</button>
    <button class="mode-tab" onclick="setMode('grid')" id="tab-grid">🔍 網格觀察</button>
    <button class="mode-tab" onclick="setMode('symmetry')" id="tab-symmetry">🦋 對稱魔法</button>
    <button class="mode-tab" onclick="setMode('color')" id="tab-color">🌈 混色創作</button>
  </div>
</header>

<div class="workspace">
  <!-- Coach Panel -->
  <aside class="panel">
    <div class="section-title">
      <span>📚 步驟拆解小老師</span>
      <span id="stepBadge" style="color:var(--primary);font-size:0.76rem">🐱 幾何小貓 · 第 1/4 步</span>
    </div>
    <div class="lesson-grid">
      <button class="lesson-btn active" onclick="setLesson('cat')" id="les-cat">🐱 小貓</button>
      <button class="lesson-btn" onclick="setLesson('rocket')" id="les-rocket">🚀 火箭</button>
      <button class="lesson-btn" onclick="setLesson('dino')" id="les-dino">🦕 恐龍</button>
      <button class="lesson-btn" onclick="setLesson('fox')" id="les-fox">🦊 狐狸</button>
    </div>
    <div class="coach-row">
      <div class="preview-box">
        <canvas id="miniCanvas" width="160" height="120" style="width:100%;height:auto;aspect-ratio:4/3;background:#fff;border-radius:6px"></canvas>
      </div>
      <div class="step-info">
        <div class="step-tip" id="stepTip"></div>
        <div class="btn-row">
          <button class="btn btn-sec" onclick="step(-1)">⬅️ 上一步</button>
          <button class="btn btn-acc" onclick="pulseGuide()">✨ 提示</button>
          <button class="btn btn-pri" onclick="step(1)">下一步 ➡️</button>
        </div>
      </div>
    </div>
    <div class="toggles-bar">
      <label><input type="checkbox" id="guideChk" checked onchange="drawOverlays()"> 👁️ 描紅線</label>
      <label>透明度 <input type="range" id="guideAlpha" min="15" max="85" value="42" style="width:65px" oninput="drawOverlays()"></label>
      <label><input type="checkbox" id="gridChk" onchange="drawOverlays()"> 📏 九宮格</label>
      <label>🦋 <select id="symSel" onchange="drawOverlays()" style="padding:2px 4px;border-radius:6px;font-size:0.75rem">
        <option value="none">無對稱</option>
        <option value="v">左右對稱</option>
        <option value="q">四向對稱</option>
      </select></label>
    </div>
  </aside>

  <!-- Canvas Stage -->
  <main class="stage">
    <div class="toolbar">
      <div style="display:flex;gap:5px">
        <button class="btn btn-sec" onclick="undo()">↩️ 復原</button>
        <button class="btn btn-sec" onclick="redo()">↪️ 重做</button>
        <button class="btn btn-sec" onclick="clearPad()">🗑️ 清空</button>
      </div>
      <div style="display:flex;gap:5px">
        <button class="btn btn-acc" onclick="saveArt()">⭐ 收藏</button>
        <button class="btn btn-pri" onclick="dlArt()">💾 下載</button>
      </div>
    </div>
    <div class="canvas-wrap" id="wrap">
      <canvas class="layer" id="drawCanvas"></canvas>
      <canvas class="layer" id="guideCanvas"></canvas>
      <canvas class="layer" id="gridCanvas"></canvas>
    </div>
  </main>

  <!-- Tools & Palette Panel -->
  <aside class="panel">
    <div class="section-title">
      <span>🖌️ 魔法畫具箱</span>
      <span style="font-size:0.75rem;color:var(--muted)">粗細: <b id="szLbl">8 px</b> <input type="range" min="2" max="36" value="8" style="width:75px;vertical-align:middle" oninput="sz=+this.value;document.getElementById('szLbl').textContent=sz+' px'"></span>
    </div>
    <div class="tool-grid">
      <button class="tool-btn active" onclick="setBrush('pencil')" id="b-pencil"><span>✏️</span>鉛筆</button>
      <button class="tool-btn" onclick="setBrush('marker')" id="b-marker"><span>🖍️</span>麥克筆</button>
      <button class="tool-btn" onclick="setBrush('water')" id="b-water"><span>💧</span>水彩筆</button>
      <button class="tool-btn" onclick="setBrush('rainbow')" id="b-rainbow"><span>🌈</span>彩虹筆</button>
      <button class="tool-btn" onclick="setBrush('star')" id="b-star"><span>⭐</span>星星筆</button>
      <button class="tool-btn" onclick="setBrush('eraser')" id="b-eraser"><span>🧽</span>橡皮擦</button>
    </div>
    <div class="palette" id="pal"></div>
    <div class="mixer">
      <div>
        <div style="font-size:0.76rem;font-weight:800">🧪 顏料混色實驗</div>
        <div id="mixTxt" style="font-size:0.7rem;color:var(--muted)">混色示意，點方塊使用</div>
      </div>
      <div class="mixer-slots">
        <div class="slot" id="slotA" style="background:#FF595E" onclick="mix('A')"></div><b>+</b>
        <div class="slot" id="slotB" style="background:#FFCA3A" onclick="mix('B')"></div><b>=</b>
        <div class="mix-out" id="mixOut" style="background:#FF924C" onclick="useMix()"></div>
      </div>
    </div>
    <div>
      <span class="badge" id="bg-first">🎨 第一筆</span>
      <span class="badge" id="bg-step">📐 完成拆解</span>
      <span class="badge" id="bg-mix">🧪 混色達人</span>
      <span class="badge" id="bg-sym">🦋 對稱大師</span>
      <span class="badge" id="bg-save">🖼️ 收藏家</span>
    </div>
  </aside>
</div>

<div class="modal" id="galModal">
  <div class="modal-card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h3>🖼️ 小畫家專屬作品集</h3>
      <button class="btn btn-sec" style="flex:0;padding:5px 12px" onclick="document.getElementById('galModal').classList.remove('open')">✖ 關閉</button>
    </div>
    <div id="galGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const LESSONS = {
  cat: {name:"🐱 幾何小貓", steps:[
    {tip:"第1步：先畫一個大圓當貓咪的頭，左右加兩個三角形耳朵！", fn:(c,w,h)=>{c.beginPath();c.arc(w*.5,h*.36,h*.15,0,7);c.moveTo(w*.39,h*.25);c.lineTo(w*.35,h*.12);c.lineTo(w*.45,h*.21);c.moveTo(w*.61,h*.25);c.lineTo(w*.65,h*.12);c.lineTo(w*.55,h*.21);c.stroke()}},
    {tip:"第2步：在頭下方畫一個直立橢圓形身體，底下加兩隻小圓腳。", fn:(c,w,h)=>{c.beginPath();c.ellipse(w*.5,h*.65,h*.14,h*.18,0,0,7);c.stroke();c.beginPath();c.arc(w*.44,h*.82,h*.035,0,7);c.arc(w*.56,h*.82,h*.035,0,7);c.stroke()}},
    {tip:"第3步：畫上圓眼睛、小鼻子，還有微笑的 W 嘴巴！", fn:(c,w,h)=>{c.beginPath();c.arc(w*.45,h*.34,h*.02,0,7);c.moveTo(w*.57,h*.34);c.arc(w*.55,h*.34,h*.02,0,7);c.moveTo(w*.48,h*.4);c.arc(w*.48,h*.4,h*.02,0,3.14);c.arc(w*.52,h*.4,h*.02,0,3.14);c.stroke()}},
    {tip:"第4步：左右畫上翹鬍鬚，再加一條彎彎的長尾巴並塗上顏色！", fn:(c,w,h)=>{c.beginPath();c.moveTo(w*.38,h*.36);c.lineTo(w*.28,h*.34);c.moveTo(w*.38,h*.39);c.lineTo(w*.28,h*.39);c.moveTo(w*.62,h*.36);c.lineTo(w*.72,h*.34);c.moveTo(w*.62,h*.39);c.lineTo(w*.72,h*.39);c.moveTo(w*.6,h*.74);c.quadraticCurveTo(w*.76,h*.7,w*.77,h*.52);c.stroke()}}
  ]},
  rocket: {name:"🚀 太空火箭", steps:[
    {tip:"第1步：在畫布中央畫一個長橢圓形當作火箭機身！", fn:(c,w,h)=>{c.beginPath();c.ellipse(w*.5,h*.48,h*.13,h*.26,0,0,7);c.stroke()}},
    {tip:"第2步：頂部畫弧線分出鼻錐，中間畫圓形太空觀景窗。", fn:(c,w,h)=>{c.beginPath();c.moveTo(w*.4,h*.33);c.quadraticCurveTo(w*.5,h*.36,w*.6,h*.33);c.moveTo(w*.5+h*.05,h*.46);c.arc(w*.5,h*.46,h*.05,0,7);c.stroke()}},
    {tip:"第3步：在機身左右兩側對稱畫出推進尾翼。", fn:(c,w,h)=>{c.beginPath();c.moveTo(w*.39,h*.58);c.quadraticCurveTo(w*.28,h*.65,w*.32,h*.77);c.lineTo(w*.42,h*.7);c.moveTo(w*.61,h*.58);c.quadraticCurveTo(w*.72,h*.65,w*.68,h*.77);c.lineTo(w*.58,h*.7);c.stroke()}},
    {tip:"第4步：底部加上噴射火焰，再用星星筆點綴太空背景！", fn:(c,w,h)=>{c.beginPath();c.moveTo(w*.45,h*.74);c.lineTo(w*.42,h*.86);c.lineTo(w*.5,h*.92);c.lineTo(w*.58,h*.86);c.lineTo(w*.55,h*.74);c.stroke()}}
  ]},
  dino: {name:"🦕 微笑恐龍", steps:[
    {tip:"第1步：左上畫一個小圓當頭，右下畫一個大橢圓當恐龍身體。", fn:(c,w,h)=>{c.beginPath();c.arc(w*.34,h*.28,h*.09,0,7);c.moveTo(w*.54+h*.17,h*.6);c.ellipse(w*.54,h*.6,h*.17,h*.13,0,0,7);c.stroke()}},
    {tip:"第2步：用平滑曲線連起長脖子，右邊延伸出翹尾巴！", fn:(c,w,h)=>{c.beginPath();c.moveTo(w*.38,h*.34);c.quadraticCurveTo(w*.43,h*.45,w*.44,h*.5);c.moveTo(w*.31,h*.36);c.quadraticCurveTo(w*.35,h*.52,w*.4,h*.56);c.moveTo(w*.66,h*.56);c.quadraticCurveTo(w*.8,h*.5,w*.82,h*.42);c.quadraticCurveTo(w*.77,h*.66,w*.65,h*.68);c.stroke()}},
    {tip:"第3步：在肚子下方畫出穩重的恐龍腳。", fn:(c,w,h)=>{c.beginPath();c.rect(w*.43,h*.7,h*.05,h*.12);c.rect(w*.56,h*.7,h*.05,h*.12);c.stroke()}},
    {tip:"第4步：背上畫小三角形骨板，加上微笑眼睛並上色！", fn:(c,w,h)=>{c.beginPath();c.arc(w*.32,h*.26,h*.015,0,7);c.moveTo(w*.46,h*.49);c.lineTo(w*.5,h*.42);c.lineTo(w*.54,h*.48);c.lineTo(w*.58,h*.42);c.lineTo(w*.62,h*.49);c.stroke()}}
  ]},
  fox: {name:"🦊 森林狐狸", steps:[
    {tip:"第1步：畫一個圓弧頂的倒三角形臉蛋與兩隻大尖耳。", fn:(c,w,h)=>{c.beginPath();c.moveTo(w*.38,h*.28);c.quadraticCurveTo(w*.5,h*.23,w*.62,h*.28);c.lineTo(w*.5,h*.45);c.closePath();c.moveTo(w*.39,h*.27);c.lineTo(w*.35,h*.13);c.lineTo(w*.45,h*.25);c.moveTo(w*.61,h*.27);c.lineTo(w*.65,h*.13);c.lineTo(w*.55,h*.25);c.stroke()}},
    {tip:"第2步：在頭下方畫坐姿身體與胸前毛領。", fn:(c,w,h)=>{c.beginPath();c.moveTo(w*.45,h*.42);c.lineTo(w*.4,h*.76);c.lineTo(w*.6,h*.76);c.lineTo(w*.55,h*.42);c.stroke()}},
    {tip:"第3步：側面畫一條像大樹葉一樣蓬鬆的狐狸大尾巴。", fn:(c,w,h)=>{c.beginPath();c.moveTo(w*.59,h*.72);c.bezierCurveTo(w*.78,h*.75,w*.82,h*.48,w*.7,h*.44);c.bezierCurveTo(w*.62,h*.48,w*.62,h*.62,w*.58,h*.68);c.stroke()}},
    {tip:"第4步：畫上小黑鼻頭與笑眼，再用混色實驗室調出橘色上色！", fn:(c,w,h)=>{c.beginPath();c.arc(w*.5,h*.44,h*.02,0,7);c.moveTo(w*.43,h*.33);c.quadraticCurveTo(w*.45,h*.3,w*.47,h*.33);c.moveTo(w*.53,h*.33);c.quadraticCurveTo(w*.55,h*.3,w*.57,h*.33);c.stroke()}}
  ]}
};
let curLes='cat',curStep=0,brush='pencil',col='#2B2D42',sz=8,hue=0,drawing=false,last=null,undos=[],redos=[];
const COLORS=['#2B2D42','#FF595E','#FF7A59','#FFCA3A','#8AC926','#06D6A0','#1982C4','#3EC1D3','#6A4C93','#B5179E','#8D5B4C','#FFFFFF'];
const MIXES=[{n:'紅',h:'#FF595E',r:255,g:89,b:94},{n:'黃',h:'#FFCA3A',r:255,g:202,b:58},{n:'藍',h:'#1982C4',r:25,g:130,b:196},{n:'白',h:'#FFFFFF',r:255,g:255,b:255}];
let mA=0,mB=1,deferredPrompt=null;
const dc=document.getElementById('drawCanvas'),gc=document.getElementById('guideCanvas'),grc=document.getElementById('gridCanvas');
const dctx=dc.getContext('2d'),gctx=gc.getContext('2d'),grctx=grc.getContext('2d');

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),2200)}
function badge(id){const el=document.getElementById(id);if(el&&!el.classList.contains('on')){el.classList.add('on');toast('🏅 解鎖徽章：'+el.textContent)}}

function init(){
  const pal=document.getElementById('pal');
  COLORS.forEach((c,i)=>{
    const d=document.createElement('div');d.className='swatch'+(i===0?' active':'');d.style.background=c;
    if(c==='#FFFFFF')d.style.border='2px solid #CBD5E1';
    d.onclick=()=>{col=c;if(brush==='eraser')setBrush('pencil');document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));d.classList.add('active')};
    pal.appendChild(d);
  });
  resize();window.addEventListener('resize',resize);
  updateGalCnt();
}
function resize(){
  // Keep one 4:3 drawing space so rotation never stretches or erases artwork.
  if(dc.dataset.ready)return;
  [dc,gc,grc].forEach(c=>{c.width=1024;c.height=768});
  dctx.fillStyle='#FFFFFF';dctx.fillRect(0,0,dc.width,dc.height);
  dc.dataset.ready='true';pushHist();drawOverlays();
}
function pushHist(){if(undos.length>18)undos.shift();undos.push(dc.toDataURL());redos=[]}
function undo(){if(undos.length<=1)return;redos.push(undos.pop());loadUrl(undos[undos.length-1])}
function redo(){if(!redos.length)return;const u=redos.pop();undos.push(u);loadUrl(u)}
let historyVersion=0;
function loadUrl(u){const v=++historyVersion;const img=new Image();img.onload=()=>{if(v!==historyVersion)return;dctx.clearRect(0,0,dc.width,dc.height);dctx.drawImage(img,0,0,dc.width,dc.height)};img.src=u}
function clearPad(){historyVersion++;dctx.fillStyle='#FFFFFF';dctx.fillRect(0,0,dc.width,dc.height);pushHist();toast('✨ 畫布已清空')}

function stroke(p1,p2){
  const sym=document.getElementById('symSel').value,w=dc.width,h=dc.height;
  if(brush==='rainbow')hue=(hue+5)%360;
  const seg=(a,b)=>{
    dctx.save();dctx.lineCap='round';dctx.lineJoin='round';
    let lw=sz;
    if(brush==='pencil'){dctx.globalAlpha=.85;dctx.strokeStyle=col}
    else if(brush==='marker'){lw=sz*1.4;dctx.strokeStyle=col}
    else if(brush==='water'){lw=sz*2;dctx.globalAlpha=.16;dctx.strokeStyle=col;dctx.shadowColor=col;dctx.shadowBlur=6}
    else if(brush==='rainbow'){dctx.strokeStyle=`hsl(${hue},90%,55%)`;lw=sz*1.3}
    else if(brush==='eraser'){dctx.strokeStyle='#FFFFFF';lw=sz*2.2}
    else if(brush==='star'){if(p1===p2||Math.hypot(b.x-a.x,b.y-a.y)>0){dctx.fillStyle=col;dctx.font=(sz*2)+'px sans-serif';dctx.fillText('★',b.x-sz,b.y+sz)}dctx.restore();return}
    dctx.lineWidth=lw;dctx.beginPath();dctx.moveTo(a.x,a.y);dctx.lineTo(b.x,b.y);dctx.stroke();dctx.restore();
  };
  seg(p1,p2);
  if(sym==='v'||sym==='q'){badge('bg-sym');seg({x:w-p1.x,y:p1.y},{x:w-p2.x,y:p2.y})}
  if(sym==='q'){seg({x:p1.x,y:h-p1.y},{x:p2.x,y:h-p2.y});seg({x:w-p1.x,y:h-p1.y},{x:w-p2.x,y:h-p2.y})}
}
let activePointer=null;
function point(e){const r=dc.getBoundingClientRect();return {x:(e.clientX-r.left)*dc.width/r.width,y:(e.clientY-r.top)*dc.height/r.height}}
dc.onpointerdown=e=>{if(activePointer!==null||e.button>0)return;e.preventDefault();historyVersion++;activePointer=e.pointerId;dc.setPointerCapture(e.pointerId);drawing=true;last=point(e);stroke(last,last);badge('bg-first')};
dc.onpointermove=e=>{if(!drawing||e.pointerId!==activePointer)return;const p=point(e);stroke(last,p);last=p};
function endStroke(e){if(e.pointerId!==activePointer)return;drawing=false;activePointer=null;last=null;pushHist()}
dc.onpointerup=endStroke;dc.onpointercancel=endStroke;dc.onlostpointercapture=endStroke;

function drawOverlays(){
  const w=gc.width,h=gc.height;gctx.clearRect(0,0,w,h);grctx.clearRect(0,0,w,h);
  const les=LESSONS[curLes];
  if(document.getElementById('guideChk').checked){
    gctx.save();gctx.globalAlpha=document.getElementById('guideAlpha').value/100;gctx.lineCap='round';
    for(let i=0;i<=curStep;i++){
      gctx.lineWidth=i===curStep?4.5:2.5;gctx.setLineDash(i===curStep?[8,6]:[]);
      gctx.strokeStyle=i===curStep?'#FF7A59':'#64748B';les.steps[i].fn(gctx,w,h);
    }
    gctx.restore();
  }
  if(document.getElementById('gridChk').checked){
    grctx.save();grctx.strokeStyle='rgba(62,193,211,.55)';grctx.lineWidth=1.5;grctx.setLineDash([6,6]);
    for(let i=1;i<=2;i++){grctx.beginPath();grctx.moveTo(w/3*i,0);grctx.lineTo(w/3*i,h);grctx.moveTo(0,h/3*i);grctx.lineTo(w,h/3*i);grctx.stroke()}
    grctx.restore();
  }
  const sym=document.getElementById('symSel').value;
  if(sym!=='none'){
    grctx.save();grctx.strokeStyle='rgba(131,56,236,.5)';grctx.lineWidth=2;grctx.setLineDash([8,6]);
    grctx.beginPath();grctx.moveTo(w/2,0);grctx.lineTo(w/2,h);if(sym==='q'){grctx.moveTo(0,h/2);grctx.lineTo(w,h/2)}grctx.stroke();grctx.restore();
  }
  const mc=document.getElementById('miniCanvas'),mctx=mc.getContext('2d');
  mctx.clearRect(0,0,mc.width,mc.height);mctx.lineCap='round';
  for(let i=0;i<=curStep;i++){mctx.lineWidth=i===curStep?3:2;mctx.strokeStyle=i===curStep?'#FF7A59':'#334155';les.steps[i].fn(mctx,mc.width,mc.height)}
  document.getElementById('stepBadge').textContent=`${les.name} · 第 ${curStep+1}/${les.steps.length} 步`;
  document.getElementById('stepTip').textContent=les.steps[curStep].tip;
}
function setLesson(k){curLes=k;curStep=0;document.querySelectorAll('.lesson-btn').forEach(b=>b.classList.remove('active'));document.getElementById('les-'+k).classList.add('active');drawOverlays()}
function step(d){const l=LESSONS[curLes];if(curStep+d>=0&&curStep+d<l.steps.length){curStep+=d;if(curStep===l.steps.length-1)badge('bg-step');drawOverlays()}}
function pulseGuide(){const a=document.getElementById('guideAlpha'),v=a.value;document.getElementById('guideChk').checked=true;a.value=85;drawOverlays();setTimeout(()=>{a.value=v;drawOverlays()},800)}
function setBrush(b){brush=b;document.querySelectorAll('.tool-btn').forEach(x=>x.classList.remove('active'));document.getElementById('b-'+b).classList.add('active')}
function setMode(m){
  document.querySelectorAll('.mode-tab').forEach(t=>t.classList.remove('active'));document.getElementById('tab-'+m).classList.add('active');
  document.getElementById('guideChk').checked=(m==='step'||m==='grid');
  document.getElementById('gridChk').checked=(m==='grid');
  document.getElementById('symSel').value=(m==='symmetry'?'v':'none');
  if(m==='grid')curStep=LESSONS[curLes].steps.length-1;
  if(m==='color')setBrush('water');
  drawOverlays();
}
function mix(s){
  if(s==='A')mA=(mA+1)%MIXES.length;else if(s==='B')mB=(mB+1)%MIXES.length;
  const a=MIXES[mA],b=MIXES[mB];
  document.getElementById('slotA').style.background=a.h;document.getElementById('slotB').style.background=b.h;
  const pairs={'0,1':'#FF924C','0,2':'#8B4CB2','1,2':'#60A83B'};const key=[mA,mB].sort().join(',');
  const hex=pairs[key]||'#'+[a.r+b.r,a.g+b.g,a.b+b.b].map(x=>Math.round(x/2).toString(16).padStart(2,'0')).join('');
  const out=document.getElementById('mixOut');out.style.background=hex;out.dataset.hex=hex;
  document.getElementById('mixTxt').textContent=`${a.n}+${b.n} = 點右側方塊使用`;if(s!=='init')badge('bg-mix');
}
function useMix(){if(brush==='eraser')setBrush('pencil');document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));col=document.getElementById('mixOut').dataset.hex||'#FF924C';toast('🎨 已換上特調色：'+col)}
function readGallery(){try{const g=JSON.parse(localStorage.getItem('lp_gal')||'[]');return Array.isArray(g)?g.filter(x=>x&&typeof x.u==='string'&&x.u.startsWith('data:image/png')):[]}catch(e){return []}}
function saveArt(){
  const g=readGallery();
  g.unshift({t:LESSONS[curLes].name,d:new Date().toLocaleDateString('zh-TW'),u:dc.toDataURL()});
  try{localStorage.setItem('lp_gal',JSON.stringify(g.slice(0,12)))}catch(e){toast('作品集空間不足，請先下載 PNG 保存畫作');return;}updateGalCnt();badge('bg-save');toast('⭐ 已收藏至作品集！');
}
function updateGalCnt(){const g=readGallery();document.getElementById('galCnt').textContent=g.length}
function openGallery(){
  const g=readGallery(),c=document.getElementById('galGrid');
  c.innerHTML=g.length?g.map(x=>`<div style="border:1px solid #ddd;border-radius:8px;padding:6px;text-align:center"><img src="${x.u}" style="width:100%;height:85px;object-fit:contain"><b>${x.t}</b><div style="font-size:.7rem">${x.d}</div></div>`).join(''):'尚無收藏作品';
  document.getElementById('galModal').classList.add('open');
}
function dlArt(){const a=document.createElement('a');a.download='little-painter.png';a.href=dc.toDataURL();a.click()}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});
function installApp(){if(deferredPrompt)deferredPrompt.prompt();else toast('💡 請點瀏覽器分享按鈕 ➔「加入主畫面」即可安裝成 App！')}
mix('init');init();

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('./service-worker.js', {updateViaCache:'none'}).then(r=>r.update()).catch(() => {});
}
</script>
</body>
</html>
